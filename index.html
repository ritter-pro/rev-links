<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritter | Свет твоих эмоций</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            /* Ваши фирменные цвета */
            background: linear-gradient(
                -45deg, 
                #00265c, 
                #03080a, 
                #080c1a, 
                #1a1442, 
                #00120f, 
                #06091a
            );
            background-size: 400% 400%;
            /* Плавная анимация, которая 100% работает на телефонах */
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* Очень сильное базовое белое свечение */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 400;
            letter-spacing: 0.05em;
        }
        
        /* Эффект при наведении курсора */
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            /* Свечение усиливается */
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Эффект при клике/касании пальцем на телефоне */
        .glass-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Легкая анимация появления при загрузке */
        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .delay-100 { animation-delay: 0.2s; }
        .delay-200 { animation-delay: 0.4s; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 selection:bg-white/30">

    <!-- Строгий мобильный контейнер с ограничением ширины в 320px -->
    <main class="w-full max-w-[320px] flex flex-col items-center gap-12 z-10 relative">
        
        <!-- Блок логотипа и слогана -->
        <div class="flex flex-col items-center gap-3 fade-in w-full">
            <img 
                src="RITTER белый.png" 
                alt="RITTER" 
                class="w-full h-auto object-contain drop-shadow-lg"
            >
            <h1 class="text-white/80 font-light text-[13px] tracking-[0.2em] uppercase text-center mt-2">
                Свет твоих эмоций
            </h1>
        </div>

        <!-- Блок с ссылками -->
        <div class="flex flex-col gap-6 w-full fade-in delay-100">
            
            <!-- Кнопка 1: Почта -->
            <div class="flex flex-col gap-2 items-center">
                <span class="text-[11px] text-white/50 uppercase tracking-widest font-light">
                    Связаться с нами
                </span>
                <a href="mailto:design-studio@rev.ru" class="glass-btn">
                    design-studio@rev.ru
                </a>
            </div>

            <!-- Кнопка 2: Сайт -->
            <div class="flex flex-col gap-2 items-center">
                <span class="text-[11px] text-white/50 uppercase tracking-widest font-light">
                    Наш сайт
                </span>
                <a href="https://ritter.pro/ru/" target="_blank" rel="noopener noreferrer" class="glass-btn">
                    ritter.pro/ru/
                </a>
            </div>

        </div>

    </main>

    <!-- Минималистичный футер -->
    <footer class="absolute bottom-6 w-full text-center fade-in delay-200 pointer-events-none">
        <p class="text-white/20 text-[10px] tracking-widest uppercase font-light">
            &copy; RITTER DESIGN STUDIO
        </p>
    </footer>

</body>
</html>
