<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritter | Links & Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Анимированный градиент с нашими CMYK-оттенками */
            background: linear-gradient(
                -45deg, 
                #00265c, 
                #03080a, 
                #080c1a, 
                #1a1442, 
                #00120f, 
                #06091a
            );
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Анимация появления */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-100 { animation-delay: 150ms; }
        .delay-200 { animation-delay: 300ms; }
        .delay-300 { animation-delay: 450ms; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Анимация парения для лампы */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Стеклянные кнопки */
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .glass-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Легкое свечение на фоне -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white/5 via-transparent to-transparent pointer-events-none"></div>

    <!-- Основной контент (Две колонки) -->
    <main class="flex-grow w-full max-w-6xl mx-auto px-6 py-12 md:py-20 flex flex-col md:flex-row items-center justify-center gap-12 md:gap-16 z-10 relative">
        
        <!-- Левая колонка: Логотип и Кнопки -->
        <div class="w-full md:w-1/2 flex flex-col items-center space-y-10 fade-in-up">
            
            <!-- Логотип -->
            <img 
                src="RITTER белый.png" 
                alt="RITTER" 
                class="w-64 sm:w-80 lg:w-96 object-contain select-none filter drop-shadow-2xl opacity-95 transition-opacity hover:opacity-100"
            >

            <!-- Кнопки -->
            <div class="flex flex-col gap-5 w-full max-w-md fade-in-up delay-100">
                
                <!-- Кнопка Email -->
                <a 
                    href="mailto:design-studio@rev.ru" 
                    class="glass-btn w-full group relative overflow-hidden rounded-2xl p-5 flex items-center gap-4 text-left"
                >
                    <div class="p-3 bg-white/5 rounded-xl border border-white/10 group-hover:bg-white/10 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-lg font-medium text-white tracking-wide">Email Us</h3>
                        <p class="text-sm text-white/60 font-light mt-0.5">design-studio@rev.ru</p>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white/30 group-hover:text-white/70 transition-colors group-hover:translate-x-1 duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>

                <!-- Кнопка Website -->
                <a 
                    href="https://ritter.pro/ru/" 
                    target="_blank"
                    rel="noopener noreferrer"
                    class="glass-btn w-full group relative overflow-hidden rounded-2xl p-5 flex items-center gap-4 text-left"
                >
                    <div class="p-3 bg-white/5 rounded-xl border border-white/10 group-hover:bg-white/10 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-lg font-medium text-white tracking-wide">Website</h3>
                        <p class="text-sm text-white/60 font-light mt-0.5">ritter.pro/ru/</p>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white/30 group-hover:text-white/70 transition-colors group-hover:translate-x-1 duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>

        <!-- Правая колонка: Изображение продукта -->
        <div class="w-full md:w-1/2 flex justify-center items-center fade-in-up delay-200">
            <!-- Класс mix-blend-screen убирает черный фон картинки на нашем темном фоне -->
            <img 
                src="IMG_0010.jpg" 
                alt="Ritter Floor Lamp" 
                class="w-full max-w-[320px] md:max-w-[400px] lg:max-w-[500px] object-contain mix-blend-screen animate-float drop-shadow-2xl opacity-90"
            >
        </div>

    </main>

    <!-- Минималистичный футер -->
    <footer class="w-full text-center pb-6 fade-in-up delay-300 pointer-events-none z-10">
        <p class="text-white/40 text-[10px] sm:text-xs tracking-[0.2em] uppercase font-light">
            &copy; 2026 RITTER DESIGN STUDIO
        </p>
    </footer>

</body>
</html>
