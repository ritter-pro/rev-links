<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritter | Свет твоих эмоций</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(
                -45deg, 
                #00265c, 
                #03080a, 
                #080c1a, 
                #1a1442, 
                #00120f, 
                #06091a
            );
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-100 { animation-delay: 200ms; }
        .delay-200 { animation-delay: 400ms; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Элегантное подчеркивание ссылок при наведении */
        .hover-underline-animation {
            display: inline-block;
            position: relative;
        }

        .hover-underline-animation::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: rgba(255, 255, 255, 0.6);
            transform-origin: bottom right;
            transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .hover-underline-animation:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-blue-500 selection:text-white px-6">

    <!-- Легкое свечение на фоне -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white/5 via-transparent to-transparent pointer-events-none"></div>

    <main class="w-full max-w-sm flex flex-col items-center z-10 relative mt-[-5vh]">
        
        <div class="flex flex-col items-center w-full fade-in-up">
            <!-- Логотип -->
            <img 
                src="RITTER белый.png" 
                alt="RITTER" 
                class="w-64 sm:w-72 object-contain select-none filter drop-shadow-2xl opacity-95 transition-opacity duration-500 hover:opacity-100"
            >
            
            <!-- Слоган -->
            <h1 class="mt-8 text-xl sm:text-2xl font-light tracking-[0.15em] text-white/80 uppercase text-center">
                Свет твоих эмоций
            </h1>
        </div>

        <div class="flex flex-col items-center space-y-8 w-full mt-16 fade-in-up delay-100">
            
            <!-- Ссылка Email -->
            <a 
                href="mailto:design-studio@rev.ru" 
                class="group flex flex-col items-center cursor-pointer"
            >
                <span class="text-xs text-white/40 mb-1.5 tracking-[0.2em] uppercase font-extralight transition-colors group-hover:text-white/60">
                    Связаться с нами
                </span>
                <span class="text-lg sm:text-xl font-light tracking-wider text-white/90 hover-underline-animation pb-1">
                    design-studio@rev.ru
                </span>
            </a>

            <!-- Ссылка Website -->
            <a 
                href="https://ritter.pro/ru/" 
                target="_blank"
                rel="noopener noreferrer"
                class="group flex flex-col items-center cursor-pointer"
            >
                <span class="text-xs text-white/40 mb-1.5 tracking-[0.2em] uppercase font-extralight transition-colors group-hover:text-white/60">
                    Наш сайт
                </span>
                <span class="text-lg sm:text-xl font-light tracking-wider text-white/90 hover-underline-animation pb-1">
                    ritter.pro/ru/
                </span>
            </a>

        </div>

    </main>

    <footer class="absolute bottom-8 w-full text-center fade-in-up delay-200 pointer-events-none z-10">
        <p class="text-white/30 text-[10px] sm:text-xs tracking-[0.2em] uppercase font-extralight">
            &copy; 2026 RITTER DESIGN STUDIO
        </p>
    </footer>

</body>
</html>
